company_name: "company_B"
reporting_currency: "USD"
taxonomy_file: "Cantill_DataML_Task_Kit/company_B/taxonomy_B.csv"
fx_file: "Cantill_DataML_Task_Kit/company_B/fx_rates_usd.csv"

sources:
  - name: "invoices"
    file: "Cantill_DataML_Task_Kit/company_B/invoice_lines.csv"
    prefix: ""
    id_col: "line_id"
    amount_col: "line_amount"
    amount_type: "net"
    currency_col: "currency"
    currency_rate_col: "currency_rate"
    date_col: "invoice_date"
    posting_date_col: "posting_date"
    due_date_col: "due_date"
    paid_date_col: "paid_date"
    supplier_col: "vendor_id"
    vendor_id_col: "vendor_id"
    item_id_col: "material_number"
    description_cols: ["line_description"]
    gl_account_col: "gl_account"
    gl_account_desc_col: "gl_account_description"
    document_type_col: "document_type"
    po_number_col: "po_number"
    po_line_col: "po_line"

exclusion_rules:
  non_procurement:
    intercompany_gl_patterns: ["^IC", "^I/C", "IC PAYABLES", "I/C PAYABLE"]
    tax_description_keywords: ["tax", "gst input tax", "sales tax", "state & local taxes"]
